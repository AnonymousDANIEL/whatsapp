name: Verify backend

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: verify-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  tests:
    name: Syntax and PostgreSQL tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      PUPPETEER_SKIP_DOWNLOAD: "true"
      TEST_DATABASE_URL: postgresql://postgres:ci_test_password@localhost:5432/postgres
    services:
      postgres:
        image: postgres:17-bookworm
        env:
          POSTGRES_PASSWORD: ci_test_password
          POSTGRES_DB: postgres
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres -d postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    steps:
      - name: Read repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22"
          cache: npm
          package-manager-cache: false
      - name: Install locked dependencies
        run: npm ci
      - name: Check JavaScript
        run: npm run check
      - name: Test permissions, schedules and sender results
        run: npm test

  containers:
    name: Build ${{ matrix.image }} container
    needs: tests
    runs-on: ubuntu-latest
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        include:
          - image: api
            dockerfile: Dockerfile
          - image: worker
            dockerfile: Dockerfile.worker
    steps:
      - name: Read repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Verify production image builds
        run: docker build --progress=plain --file "${{ matrix.dockerfile }}" --tag "whatsapp-${{ matrix.image }}:ci" .
