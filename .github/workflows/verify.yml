name: Verify backend

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: verify-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  tests:
    name: Syntax and PostgreSQL tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      PUPPETEER_SKIP_DOWNLOAD: "true"
      TEST_DATABASE_URL: postgresql://postgres:ci_test_password@localhost:5432/postgres
    services:
      postgres:
        image: postgres:17-bookworm
        env:
          POSTGRES_PASSWORD: ci_test_password
          POSTGRES_DB: postgres
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres -d postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    steps:
      - name: Read repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22"
          cache: npm
          package-manager-cache: false
      - name: Install locked dependencies
        run: npm ci
      - name: Audit production dependencies
        run: npm audit --omit=dev --audit-level=high
      - name: Check JavaScript
        run: npm run check && node --check src/overview.js
      - name: Test permissions, schedules and sender results
        run: npm test
      - name: Shared WhatsApp browser tests
        env:
          UI_SCREENSHOT_DIR: test-output/workspace-header
        run: CHROME_PATH="$(command -v google-chrome)" node test/shared-ui.cjs
      - name: QR viewer recovery browser tests
        run: CHROME_PATH="$(command -v google-chrome)" node test/viewer-ui.cjs
      - name: Image and caption sending browser tests without live WhatsApp messages
        run: CHROME_PATH="$(command -v google-chrome)" node test/workspace-send-ui.cjs
      - name: Save synthetic workspace UI screenshots
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: workspace-header-ui
          path: test-output/workspace-header/
          if-no-files-found: ignore
          retention-days: 7

  containers:
    name: Build ${{ matrix.image }} container
    needs: tests
    runs-on: ubuntu-latest
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        include:
          - image: api
            dockerfile: Dockerfile
          - image: worker
            dockerfile: Dockerfile.worker
          - image: maintenance
            dockerfile: Dockerfile.maintenance
    steps:
      - name: Read repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Verify production image builds
        run: docker build --progress=plain --file "${{ matrix.dockerfile }}" --tag "whatsapp-${{ matrix.image }}:ci" .
      - name: Test isolated worker browser startup and cleanup
        if: matrix.image == 'worker'
        run: >-
          docker run --rm --network none --cpus 2 --memory 2g --pids-limit 1000
          --mount type=bind,source="$GITHUB_WORKSPACE/test/browser-smoke.cjs",target=/app/test/browser-smoke.cjs,readonly
          --entrypoint node whatsapp-worker:ci /app/test/browser-smoke.cjs
      - name: Verify private database backup and complete isolated restore
        if: matrix.image == 'maintenance'
        run: >-
          docker run --rm --network none --cpus 2 --memory 2g --pids-limit 1000
          --entrypoint /bin/bash whatsapp-maintenance:ci /app/test/maintenance-smoke.sh
      - name: Reproduce private-UID X11 lock collision and verify isolated slot reuse
        if: matrix.image == 'worker'
        run: >-
          docker run --rm --network none --cpus 2 --memory 2g --pids-limit 1000
          --env NODE_OPTIONS=--require=/app/src/desktop-lock-preload.js
          --mount type=bind,source="$GITHUB_WORKSPACE/test/desktop-lock-smoke.cjs",target=/app/test/desktop-lock-smoke.cjs,readonly
          --entrypoint node whatsapp-worker:ci /app/test/desktop-lock-smoke.cjs
      - name: Test worker orphan reaping below the Railway-style init wrapper
        if: matrix.image == 'worker'
        run: >-
          docker run --rm --network none --pids-limit 1000
          --mount type=bind,source="$GITHUB_WORKSPACE/test/subreaper-smoke.cjs",target=/app/test/subreaper-smoke.cjs,readonly
          --mount type=bind,source="$GITHUB_WORKSPACE/Dockerfile.worker",target=/app/Dockerfile.worker,readonly
          --entrypoint node whatsapp-worker:ci /app/test/subreaper-smoke.cjs
      - name: Test seven concurrent QR browser desktops under the production task limit
        if: matrix.image == 'worker'
        run: >-
          docker run --rm --network none --cpus 2 --memory 3g --pids-limit 1000
          --mount type=bind,source="$GITHUB_WORKSPACE/test/browser-fleet-smoke.cjs",target=/app/test/browser-fleet-smoke.cjs,readonly
          --entrypoint node whatsapp-worker:ci /app/test/browser-fleet-smoke.cjs


