<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>mywasap</title><meta name="application-name" content="mywasap"><link rel="icon" type="image/svg+xml" href="/mywasap.svg?v=brand2"><link rel="stylesheet" href="/style.css?v=shared10"><script defer src="/i18n.js?v=shared10"></script><script defer src="/banks.js?v=billing4"></script><script defer src="/shared.js?v=shared10"></script><script defer src="/app.js?v=shared10"></script></head>
<body><div id="toast" role="status"></div><div class="language"><select id="language" aria-label="Language"><option value="zh">中文</option><option value="en">English</option></select></div>
<section id="session-loading" class="login"><div class="login-card"><div class="brand"><img src="/mywasap.svg?v=brand2#logo" alt="mywasap" width="810" height="682" decoding="async"></div><p id="session-message">…</p><button id="session-retry" data-zh="重试" data-en="Retry" hidden>Retry</button></div></section>
<section id="login" class="login" hidden><form id="login-form" class="login-card"><div class="brand"><img src="/mywasap.svg?v=brand2#logo" alt="mywasap" width="810" height="682" decoding="async"></div><label>USER ID<input name="username" required autocomplete="username" maxlength="40"></label><label><span data-zh="密码" data-en="Password"></span><input name="password" type="password" required autocomplete="current-password" maxlength="200"></label><button class="primary" data-zh="登录" data-en="Sign in"></button><p id="login-error" class="error"></p></form></section>
<div id="shell" hidden><aside><div class="brand"><img src="/mywasap.svg?v=brand2#logo" alt="mywasap" width="810" height="682" decoding="async"></div><nav id="nav"></nav><div class="aside-footer"><strong id="identity"></strong><small id="role"></small><button id="password-btn" class="ghost" hidden data-zh="修改密码" data-en="Change password"></button><button id="logout" class="ghost" data-zh="退出登录" data-en="Sign out"></button></div></aside><main><section id="workspace-notice" class="workspace-notice" role="status" hidden></section><header><div><p class="eyebrow">PRIVATE WORKSPACE</p><h1 id="page-title"></h1></div><div class="header-right"><span id="clock"></span><button id="refresh" class="secondary" data-zh="刷新" data-en="Refresh"></button></div></header><div id="content"></div><footer data-zh="所有时间以马来西亚时间 UTC+8 显示。消息提交、送达和已读分别统计。" data-en="All displayed times use Malaysia UTC+8. Sent, delivered and read statuses are counted separately."></footer></main></div>
<dialog id="modal"><div class="modal-head"><h2 id="modal-title"></h2><button id="close-modal" type="button" data-zh="关闭" data-en="Close"></button></div><div id="modal-content"></div></dialog></body></html>
