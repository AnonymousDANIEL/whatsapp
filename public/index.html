<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>WA Workspace</title><link rel="stylesheet" href="/style.css"><script defer src="/i18n.js"></script><script defer src="/app.js"></script></head>
<body><div id="toast" role="status"></div><div class="language"><select id="language" aria-label="Language"><option value="zh">中文</option><option value="en">English</option></select></div>
<section id="session-loading" class="login"><div class="login-card"><div class="brand">WA <span>WORKSPACE</span></div><p id="session-message">…</p><button id="session-retry" data-zh="重试" data-en="Retry" hidden>Retry</button></div></section>
<section id="login" class="login" hidden><form id="login-form" class="login-card"><div class="brand">WA <span>WORKSPACE</span></div><h1 data-zh="登录工作后台" data-en="Sign in to your workspace"></h1><label>USER ID<input name="username" required autocomplete="username" maxlength="40"></label><label><span data-zh="密码" data-en="Password"></span><input name="password" type="password" required autocomplete="current-password" maxlength="200"></label><button class="primary" data-zh="登录" data-en="Sign in"></button><p id="login-error" class="error"></p></form></section>
<div id="shell" hidden><aside><div class="brand">WA <span>WORKSPACE</span></div><nav id="nav"></nav><div class="aside-footer"><strong id="identity"></strong><small id="role"></small><button id="password-btn" class="ghost" data-zh="修改密码" data-en="Change password"></button><button id="logout" class="ghost" data-zh="退出登录" data-en="Sign out"></button></div></aside><main><header><div><p class="eyebrow">PRIVATE WORKSPACE</p><h1 id="page-title"></h1></div><div class="header-right"><span id="clock"></span><button id="refresh" class="secondary" data-zh="刷新" data-en="Refresh"></button></div></header><div id="content"></div><footer data-zh="所有时间以UTC 国际标准时间 显示。消息提交、送达和已读分别统计。" data-en="All displayed times use UTC. Sent, delivered and read statuses are counted separately."></footer></main></div>
<dialog id="modal"><div class="modal-head"><h2 id="modal-title"></h2><button id="close-modal" type="button" data-zh="关闭" data-en="Close"></button></div><div id="modal-content"></div></dialog></body></html>
