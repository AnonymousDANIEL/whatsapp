<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>WhatsApp 工作后台</title><link rel="stylesheet" href="/style.css"><script defer src="/app.js"></script></head>
<body><div id="toast" role="status"></div>
<section id="login" class="login"><form id="login-form" class="login-card"><div class="brand">WA <span>WORKSPACE</span></div><h1>登录工作后台</h1><p class="muted">独立账号 · 分组工作 · 权限管理</p><label>Manager / Staff ID<input name="username" required autocomplete="username" maxlength="40"></label><label>密码<input name="password" type="password" required autocomplete="current-password" maxlength="200"></label><button class="primary">登录</button><p id="login-error" class="error"></p></form></section>
<div id="shell" hidden><aside><div class="brand">WA <span>WORKSPACE</span></div><p class="aside-caption">工作管理后台</p><nav id="nav"></nav><div class="aside-footer"><strong id="identity"></strong><small id="role"></small><button id="password-btn" class="ghost">修改密码</button><button id="logout" class="ghost">退出登录</button></div></aside>
<main><header><div><p class="eyebrow">PRIVATE WORKSPACE</p><h1 id="page-title">总览</h1></div><div class="header-right"><span class="dot"></span><span>马来西亚时间</span><time id="clock"></time><button id="refresh" class="secondary">刷新</button></div></header><div id="content"></div><footer>扫码连接使用 WhatsApp Web；自动任务状态以实际回执为准。</footer></main></div>
<dialog id="modal"><div class="modal-head"><h2 id="modal-title"></h2><button id="close-modal" class="ghost" type="button">关闭</button></div><div id="modal-content"></div></dialog>
</body></html>
