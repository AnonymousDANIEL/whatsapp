<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>mywasap</title><meta name="application-name" content="mywasap">
<link rel="icon" type="image/svg+xml" href="/mywasap.svg?v=brand2">
<link rel="stylesheet" href="/style.css?v=shared11"><link rel="stylesheet" href="/workspace-header.css?v=header1">
<script defer src="/i18n.js?v=qr-demand1"></script><script defer src="/workspace-header.js?v=header1"></script>
<script defer src="/banks.js?v=billing4"></script><script defer src="/shared.js?v=refund1"></script><script defer src="/app.js?v=header1"></script>
</head>
<body>
<div id="toast" role="status"></div>
<div id="login-tools" class="login-tools"><div id="appearance-controls" class="appearance-controls">
  <button id="theme-toggle" class="header-icon-button" type="button" aria-label="切换浅色模式" aria-pressed="false"></button>
  <div class="language-control">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false"><path d="M3 5h12M9 3v2M5 5c1 5 4 8 8 10M13 5c-1 5-4 8-8 10m9 6 4-10 4 10m-6-4h4"/></svg>
    <span id="language-code" aria-hidden="true">CN</span>
    <select id="language" aria-label="选择语言"><option value="zh">中文 (简体)</option><option value="en">English</option></select>
  </div>
</div></div>
<section id="session-loading" class="login"><div class="login-card"><div class="brand"><img src="/mywasap.svg?v=brand2#logo" alt="mywasap" width="810" height="682" decoding="async"></div><p id="session-message">…</p><button id="session-retry" data-zh="重试" data-en="Retry" hidden>Retry</button></div></section>
<section id="login" class="login" hidden><form id="login-form" class="login-card"><div class="brand"><img src="/mywasap.svg?v=brand2#logo" alt="mywasap" width="810" height="682" decoding="async"></div><label>USER ID<input name="username" required autocomplete="username" maxlength="40"></label><label><span data-zh="密码" data-en="Password"></span><input name="password" type="password" required autocomplete="current-password" maxlength="200"></label><button class="primary" data-zh="登录" data-en="Sign in"></button><p id="login-error" class="error"></p></form></section>
<div id="shell" hidden>
<aside><div class="brand"><img src="/mywasap.svg?v=brand2#logo" alt="mywasap" width="810" height="682" decoding="async"></div><nav id="nav"></nav><div class="aside-footer"><strong id="identity"></strong><small id="role"></small><button id="password-btn" class="ghost" hidden data-zh="修改密码" data-en="Change password"></button><button id="logout" class="ghost" data-zh="退出登录" data-en="Sign out"></button></div></aside>
<main>
<section id="workspace-notice" class="workspace-notice" role="status" hidden></section>
<header><div><p class="eyebrow">PRIVATE WORKSPACE</p><h1 id="page-title"></h1></div>
<div class="header-right">
  <time id="clock" class="clock-badge">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/></svg>
    <span class="clock-lines"><strong id="clock-time">--:--:--</strong><small id="clock-date"></small></span>
  </time>
  <div id="header-appearance-slot"></div>
  <div class="header-menu">
    <button id="help-toggle" class="header-menu-trigger" type="button" aria-expanded="false" aria-controls="help-menu">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false"><path d="M12 5v15M3 4h5a4 4 0 0 1 4 2 4 4 0 0 1 4-2h5v15h-5a4 4 0 0 0-4 1 4 4 0 0 0-4-1H3Z"/></svg>
      <span data-zh="教学" data-en="Guides"></span>
      <svg class="header-chevron" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5" aria-hidden="true" focusable="false"><path d="m4 6 4 4 4-4"/></svg>
    </button>
    <div id="help-menu" class="header-popover" hidden>
      <small class="popover-caption" data-zh="使用教学" data-en="Usage guides"></small>
      <button type="button" data-help-topic="personal" data-zh="WhatsApp 账号怎么使用" data-en="How to use WhatsApp accounts"></button>
      <button type="button" data-help-topic="shared" data-zh="共享 WhatsApp 怎么使用" data-en="How to use Shared WhatsApp"></button>
    </div>
  </div>
  <button id="refresh" class="header-icon-button" type="button" aria-label="刷新">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false"><path d="M20 7v5h-5M4 17v-5h5"/><path d="M6.2 6.2A8 8 0 0 1 20 12M4 12a8 8 0 0 0 13.8 5.8"/></svg>
    <span class="sr-only" data-zh="刷新" data-en="Refresh"></span>
  </button>
  <div class="header-menu">
    <button id="account-toggle" class="header-menu-trigger" type="button" aria-expanded="false" aria-controls="account-menu">
      <span id="account-greeting"></span><span id="account-name"></span>
      <svg class="header-chevron" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5" aria-hidden="true" focusable="false"><path d="m4 6 4 4 4-4"/></svg>
    </button>
    <div id="account-menu" class="header-popover" hidden>
      <div class="account-menu-detail"><small data-zh="当前账号" data-en="Current account"></small><strong id="account-detail-name"></strong><small id="account-role"></small></div>
      <button id="header-password" type="button" hidden data-zh="修改密码" data-en="Change password"></button>
      <button id="header-logout" class="logout-action" type="button" data-zh="退出登录" data-en="Sign out"></button>
    </div>
  </div>
</div></header>
<div id="content"></div><footer data-zh="所有时间以马来西亚时间 UTC+8 显示。消息提交、送达和已读分别统计。" data-en="All displayed times use Malaysia UTC+8. Sent, delivered and read statuses are counted separately."></footer>
</main></div>
<dialog id="modal"><div class="modal-head"><h2 id="modal-title"></h2><button id="close-modal" type="button" data-zh="关闭" data-en="Close"></button></div><div id="modal-content"></div></dialog>
<dialog id="guide-dialog" class="guide-dialog" aria-labelledby="guide-title">
  <div class="modal-head"><h2 id="guide-title" data-zh="使用教学" data-en="Usage guides"></h2><button id="guide-close" type="button" data-zh="关闭" data-en="Close"></button></div>
  <div class="guide-layout"><div id="guide-topics" class="guide-topics" aria-label="Usage guides"></div><div id="guide-content" class="guide-content"></div></div>
  <div class="guide-footer"><button id="guide-open-page" class="primary" type="button"></button></div>
</dialog>
</body></html>
